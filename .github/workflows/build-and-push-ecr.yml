name: Build and Push to ECR

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: read

env:
  ECR_REGISTRY: 515260921971.dkr.ecr.us-west-2.amazonaws.com
  AWS_REGION: us-west-2
  TELEPORT_FQDN: teleport.maestra.io:443
  TELEPORT_TOKEN: image-push-github-actions-mcp-grafana
  AWS_ROLE_ARN: "arn:aws:iam::515260921971:role/teleport-image-push"
  IMAGE_NAME: mcp-grafana

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Get Teleport version
        id: tp-version
        run: |
          VERSION=$(curl -sf "https://${{ env.TELEPORT_FQDN }}/webapi/find" | jq -r '.auto_update.tools_version // .server_version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Teleport binaries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.tool_cache }}/teleport
          key: teleport-${{ steps.tp-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Teleport
        uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6 # v1.1.1
        with:
          version: ${{ steps.tp-version.outputs.version }}
          proxy: ${{ env.TELEPORT_FQDN }}

      - name: ECR login via Teleport Workload Identity
        run: |
          cat > /tmp/tbot.yaml << EOF_TBOT
          version: v2
          proxy_server: ${{ env.TELEPORT_FQDN }}
          onboarding:
            join_method: github
            token: ${{ env.TELEPORT_TOKEN }}
          oneshot: true
          storage:
            type: memory
          services:
            - type: workload-identity-jwt
              destination:
                type: directory
                path: /tmp/tbot-output
              selector:
                name: image-push
              audiences: ["sts.amazonaws.com"]
          EOF_TBOT

          mkdir -p /tmp/tbot-output
          tbot start -c /tmp/tbot.yaml

          export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/tbot-output/jwt_svid
          export AWS_ROLE_ARN="${{ env.AWS_ROLE_ARN }}"
          export AWS_DEFAULT_REGION=${{ env.AWS_REGION }}

          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login ${{ env.ECR_REGISTRY }} --username AWS --password-stdin

          # Release tags are immutable: a re-minted release number must fail the
          # push, not silently overwrite an already-published image (2026-10-09:
          # GitLab re-minted release numbers after a restore and CI overwrote
          # released images). `latest` is the only moving tag, so it is excluded.
          aws ecr describe-repositories --repository-names ${{ env.IMAGE_NAME }} --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws ecr create-repository --repository-name ${{ env.IMAGE_NAME }} --region ${{ env.AWS_REGION }} \
            --image-tag-mutability IMMUTABLE_WITH_EXCLUSION \
            --image-tag-mutability-exclusion-filters 'filterType=WILDCARD,filter=latest'

      - name: Generate release number
        id: release-number
        uses: mindbox-moscow/gha-release-number@2e59ef5cea3cfc6df48854ec5718bfb520aa1337 # master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # BuildKit pushes only the layers ECR lacks; `docker push` from the fresh
      # runner daemon re-uploaded every layer of every release.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release-number.outputs.release-number }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Create GitHub release
        uses: maestra-io/github-actions/create-github-release@df704636a89df5ddddc1ba836f8b09c796456ed7 # v1.49.0
        with:
          release-number: ${{ steps.release-number.outputs.release-number }}
